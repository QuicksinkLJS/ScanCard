name: Beta channel

# A push to branch beta redeploys the site (built from main by deploy.yml, which adds beta under /beta/).
# Only runs started from main may deploy to GitHub Pages, so this just starts deploy.yml on main.
on:
  push:
    branches: [beta]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main -f quick=true
