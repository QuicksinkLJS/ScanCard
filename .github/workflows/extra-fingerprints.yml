name: Extra fingerprints (CardTrader pictures)

# Fingerprints for artworks YGOPRODeck has no picture of (YAC1 manga style, ...), see tools/build_extra_fingerprints.py.
# Runs on branch beta when the builder changes, or by hand. Commits models/ygo/extra.* and redeploys.
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "CardTrader expansion codes, comma separated"
        default: "yac1"
  push:
    branches: [beta]
    paths:
      - tools/build_extra_fingerprints.py
      - .github/workflows/extra-fingerprints.yml

permissions:
  contents: write
  actions: write

jobs:
  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet onnxruntime pillow numpy

      - uses: actions/cache/restore@v4
        with:
          path: work/ct
          key: ct-pictures-${{ github.run_id }}
          restore-keys: ct-pictures-

      - name: Build
        run: |
          mkdir -p work
          git fetch -q --depth 1 origin cardtrader-files
          git show FETCH_HEAD:cardtrader_ygo.json.gz > work/cardtrader_ygo.json.gz
          python tools/build_extra_fingerprints.py --cardtrader work/cardtrader_ygo.json.gz --codes "${{ inputs.codes || 'yac1' }}" --images work/ct

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work/ct
          key: ct-pictures-${{ github.run_id }}

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ygo/extra.json models/ygo/extra.i8
          git commit -q -m "Extra fingerprints $(date -u +%Y-%m-%d)" || { echo "nothing new"; exit 0; }
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main -f quick=true
